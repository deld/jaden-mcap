# Minimal project config so that deploying from the CLI cannot silently change
# how the function is exposed.
#
# spelling-intake MUST keep verify_jwt = false: CloudMailin posts to it from
# outside Supabase and cannot send a Supabase JWT. It authenticates with a
# shared secret instead, and verifies sender provenance (see its README).
# Without this file a CLI deploy re-enables JWT verification and every
# forwarded spelling list starts failing with 401.
project_id = "zvffmucghcrqackghhlf"

[functions.spelling-intake]
verify_jwt = false

# worksheet-intake: same reason as spelling-intake - CloudMailin cannot send a
# Supabase JWT, so the function authenticates with INTAKE_SECRET instead.
[functions.worksheet-intake]
verify_jwt = false

# weekly-report: called by pg_cron with REPORT_SECRET, not a Supabase JWT.
[functions.weekly-report]
verify_jwt = false
